{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="auth card">
  <h1>Welcome back</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username or email<input type="text" name="identifier" required autofocus autocomplete="username"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary btn-block">Log in</button>
  </form>
  <p class="muted">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
</section>
{% endblock %}
